name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Agent guard
        run: bash .github/scripts/agent-guard.sh
      - run: npm ci
      - run: npm run check
      - run: npm run test:tz
